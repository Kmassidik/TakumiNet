name = "takumi"
compatibility_date = "2026-11-27"
workers_dev = false
preview_urls = false
observability = { enabled = false }

# Production domain — declared here so `wrangler deploy` keeps it:
routes = [
  { pattern = "takumi.kurniatech.my.id", custom_domain = true }
]

# Static site: no Worker code, just the compiled frontend served from the edge.
# /workspace serves index.html, /about serves about.html, etc. — Workers
# Assets maps pretty paths to matching .html files automatically.
[assets]
directory = "./web"
html_handling = "auto-trailing-slash"

[vars]
SITE_URL = "https://takumi.kurniatech.my.id"
